version: '3'

services:
  backend:
    image: node:18
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm install express jsonwebtoken dotenv && node index.js"
    ports:
      - "3000:3000"

  nginx:
    image: nginx
    volumes:
      - ./streaming/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
      - "1935:1935"
